server:
  port: 8080

spring:
  application:
    name: AirHive Backend

  datasource:
    url: ${AIRHIVE_DB_URL:jdbc:postgresql://localhost:5432/airhive}
    username: ${AIRHIVE_DB_USERNAME:airhive_user}
    password: ${AIRHIVE_DB_PASSWORD:airhive_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false
  
  data:
    redis:
      host: ${AIRHIVE_REDIS_HOST:localhost}
      port: ${AIRHIVE_REDIS_PORT:6379}

  logging:
   level:
    org.springframework.security: INFO      
airhive:
  security:
    jwt:
      secret: ${AIRHIVE_JWT_SECRET}
      expiration-ms: 604800000
  cors:
    allowed-origins: ${AIRHIVE_CORS_ORIGINS:http://localhost:8081,http://localhost:5173}
  websocket:
    allowed-origins: ${AIRHIVE_WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

  otlp:
    metrics:
      export:
        enabled: true
        url: http://otel-collector:4318/v1/metrics
        step: 30s

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  
info:
  app:
    name: AirHive Backend
    description: Airline Management System backend
    version: 1.0.0
