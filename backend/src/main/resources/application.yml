server:
  port: 8080

spring:
  application:
    name: AirHive Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/airhive
    username: airhive_user
    password: airhive_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379

  logging:
   level:
    org.springframework.security: TRACE      
airhive:
  security:
    jwt:
      secret: ${AIRHIVE_JWT_SECRET:airhive-development-secret-key-change-this-in-production-2026}
      expiration-ms: 86400000
