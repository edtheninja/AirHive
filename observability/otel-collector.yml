extensions:
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_CLOUD_PROMETHEUS_USERNAME}
      password: ${env:GRAFANA_CLOUD_PROMETHEUS_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic

  prometheusremotewrite:
    endpoint: ${env:GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL}
    auth:
      authenticator: basicauth/grafana

service:
  extensions:
    - basicauth/grafana

  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheusremotewrite]
